---
# k3s server config for the EVE-k witness node.
#
# Architecture (Phase 1.5+ FINAL — see git history for what was tried):
#
# The witness runs k3s in **server-only mode** (--disable-agent) inside
# its own network namespace (eve-witness). It contributes apiserver,
# controller-manager, scheduler, and — critically — etcd to the cluster.
# It does NOT run kubelet, kube-proxy, or flannel. The witness has no
# Kubernetes Node object, doesn't appear in `kubectl get nodes`, and
# never hosts workloads. Its sole purpose is to be the 3rd etcd vote
# for HA quorum in a 2-physical-node EVE-k cluster.
#
# Why server-only mode?
#
# In Phase 1 we tried co-locating two full k3s instances on the same
# host (pkg/kube + pkg/witness, each with kubelet). That collided on
# every host-shared resource — ports, flannel.1, iptables, etcd
# loopback. We pushed the witness into its own netns in Phase 1.5,
# which fixed networking collisions cleanly.
#
# But cgroups can't be netns-isolated. linuxkit gives each container
# its own cgroup slice (e.g. /eve/services/witness) but a HOST-VISIBLE
# /sys/fs/cgroup tree, so both kubelets see the same cgroup hierarchy.
# With the default cgroup-root="/", each kubelet creates and manages
# /sys/fs/cgroup/<controller>/kubepods/... at the host root — both
# believing they own it. The witness's kubelet then reconcile-deletes
# pkg/kube's pod cgroups (they don't appear in its apiserver, so they
# look stale to it), and pkg/kube's containers die mid-init with
# "cannot start a stopped process" / "procReady not received".
#
# We tried scoping the witness kubelet's cgroup-root to
# /eve/services/witness — but linuxkit assigns the witness slice a
# cpuset.cpus of just "0", and cgroup-v1's cpuset constraint (a child
# must be a SUBSET of its parent) means kubelet can't create kubepods
# with cpuset.cpus=0-3 under it. Widening the parent fails with EACCES
# because linuxkit owns those files. Dead end.
#
# --disable-agent eliminates the entire kubelet path: no kubepods, no
# cgroup collision, no cordon-needed (no Node), no flannel-needed (no
# CNI), no kube-proxy (no iptables). The witness is purely a k3s
# control-plane server contributing etcd to the cluster.
#
# The Phase 1 §8a collision matrix (port shifts, flannel-backend:none,
# disable-kube-proxy, kube-apiserver-arg overrides, peer-cert-allowed-
# hostname, etc.) is permanently obsolete:
#   - The netns isolates ports / iptables / 127.0.0.1 / flannel.1.
#   - --disable-agent removes kubelet + kube-proxy + flannel entirely.
#   - The remaining components (apiserver/controller-manager/scheduler/
#     etcd) all bind to node-ip inside the netns. Zero host collision.
#
# Reserved witness identity (fixed across all EVE-k installs):
#   node name: eve-witness   (00-nodename.yaml — kept for etcd member
#                             identification even without a Node object)
#   node IP:   WITNESS_NODE_IP (rendered to 02-witness-network.yaml)

log: "/persist/kubelog/witness.log"
write-kubeconfig-mode: "0644"

# THE pivot — see the long comment above.
disable-agent: true

# node-ip is rendered into config.yaml.d/02-witness-network.yaml on every
# container start by witness-init.sh, from $WITNESS_NODE_IP in
# lib/config.sh — overridable via /persist/witness-override.env without
# an image rebuild.

# Match pkg/kube's "disable agent tunneling, we are on the same network".
# Required by k3s's critical-configuration check at Phase 2 join time —
# all servers in the cluster must agree.
egress-selector-mode: "disabled"

# Match pkg/kube's disabled add-ons (critical-config compatibility).
disable-network-policy: true
disable-cloud-controller: true

# Even though --disable-agent means no Node will exist to schedule
# add-on pods onto, leave the addon disables in place. They affect
# what k3s WRITES to /var/lib/rancher/k3s/server/manifests/ at startup
# (charts that would otherwise sit Pending if a Node ever appeared).
# Matches pkg/kube's set for Phase 2 critical-config compatibility.
disable:
  - servicelb
  - traefik
  - coredns
  - local-storage
  - metrics-server

# etcd tuning. Match pkg/kube's settings. URL flags intentionally absent —
# k3s derives them from node-ip and overriding them breaks bootstrap
# reconcile (see design doc §8a "Don't override etcd peer/client URLs
# via etcd-arg").
etcd-arg:
  - "quota-backend-bytes=2147483648"
  - "auto-compaction-mode=periodic"
  - "auto-compaction-retention=1h"
  - "snapshot-count=5000"
etcd-expose-metrics: true

# Controller-manager + apiserver tuning matched to pkg/kube. With
# --disable-agent there's no kubelet to tune, so the entire kubelet-arg
# block is gone (was: node-status-update-frequency, cpu-manager-policy,
# cpu-manager-reconcile-period, reserved-cpus). Likewise node-taint is
# gone (no Node to taint), as is container-runtime-endpoint /
# default-local-storage-path (no kubelet means no pod runtime, no PVs).
kube-controller-arg:
  - "node-monitor-period=10s"
  - "node-monitor-grace-period=40s"
kube-apiserver-arg:
  - "event-ttl=72h"
